<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perceptrum</title>
  <meta name="description" content="Perceptrum is a biotechnology company. More soon.">
  <style>
    :root { --bg: #f7f6f2; --fg: #16181d; --muted: #5b606b; --accent: #2f6f5e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --fg: #eceae4; --muted: #9a9fa8; --accent: #7cc4ad; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: 2rem 1.25rem;
    }
    main { width: 100%; max-width: 40rem; margin: 0 auto; }
    .mark { width: 2.5rem; height: 2.5rem; margin-bottom: 2rem; color: var(--accent); }
    h1 { font-size: clamp(2.25rem, 7vw, 3.5rem); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 1rem; }
    p { font-size: 1.125rem; line-height: 1.6; color: var(--muted); margin: 0 0 2.5rem; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
    a:hover { opacity: 0.8; }
    footer { width: 100%; max-width: 40rem; margin: 4rem auto 0; font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="8"/><circle cx="20" cy="20" r="1.5" fill="currentColor"/>
    </svg>
    <h1>Perceptrum</h1>
    <p>A biotechnology company. More soon.</p>
    <a href="mailto:hello@perceptrum.com">hello@perceptrum.com</a>
  </main>
  <footer>&copy; 2026 Perceptrum</footer>
</body>
</html>
